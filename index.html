<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Receipt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus+Jakarta+Sans', sans-serif; }
        .ticket-cut {
            clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 95% 75%, 100% 80%, 100% 100%, 0% 100%, 0% 80%, 5% 75%, 0% 70%);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-indigo-600 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-800 tracking-tight">FASTINTERCITY</h1>
                <p class="text-[10px] opacity-80 uppercase tracking-widest">Premium Travel</p>
            </div>
            <div class="text-right">
                <span class="text-[10px] block opacity-80">REF:</span>
                <span class="text-xs font-bold">86C9C2F0</span>
            </div>
        </div>

        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-bold">From</p>
                    <p class="text-xl font-bold text-gray-800">Multan</p>
                </div>
                <div class="flex-1 flex items-center justify-center px-4">
                    <div class="h-[2px] flex-1 bg-indigo-100 relative">
                        <div class="absolute -top-1 left-1/2 -translate-x-1/2 bg-white px-2">
                            <svg class="w-3 h-3 text-indigo-600" fill="currentColor" viewBox="0 0 24 24"><path d="M15,12H11V16H15V12M15,8H11V10H15V8M19,22H5C3.89,22 3,21.11 3,20V4C3,2.9 3.9,2 5,2H19C20.11,2 21,2.9 21,4V20C21,21.11 20.11,22 19,22M19,4H5V20H19V4Z" /></svg>
                        </div>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-400 uppercase font-bold">To</p>
                    <p class="text-xl font-bold text-gray-800">Murree</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 border-t border-b border-dashed border-gray-200 py-4 mb-6">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase">Passenger</p>
                    <p class="text-sm font-semibold truncate">M. Salman Farooq</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-400 uppercase">Date</p>
                    <p class="text-sm font-semibold">27 Apr 2026</p>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase">Seat</p>
                    <p class="text-sm font-semibold">01 (Confirmed)</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-400 uppercase">Distance</p>
                    <p class="text-sm font-semibold">612 km</p>
                </div>
            </div>

            <div class="bg-gray-50 rounded-2xl p-4 flex justify-between items-center mb-4">
                <span class="text-sm font-bold text-gray-600">Total Amount</span>
                <span class="text-xl font-800 text-indigo-600">PKR 4,000</span>
            </div>

            <div class="flex items-start gap-3 bg-amber-50 p-3 rounded-xl">
                <span class="text-amber-600 text-lg">⚠️</span>
                <p class="text-[10px] text-amber-800 leading-tight">
                    <strong>Note:</strong> Please arrive at the station at least <strong>30 minutes</strong> before departure for a smooth check-in.
                </p>
            </div>
        </div>

        <div class="bg-gray-900 p-6 flex flex-col items-center gap-2">
            <div class="w-full h-12 bg-white flex items-center justify-center overflow-hidden rounded">
                <div class="flex gap-[2px] items-center">
                   <div class="h-8 w-1 bg-black"></div><div class="h-8 w-[1px] bg-black"></div><div class="h-8 w-2 bg-black"></div><div class="h-8 w-[1px] bg-black"></div><div class="h-8 w-1 bg-black"></div><div class="h-8 w-3 bg-black"></div><div class="h-8 w-1 bg-black"></div><div class="h-8 w-[2px] bg-black"></div><div class="h-8 w-1 bg-black"></div><div class="h-8 w-2 bg-black"></div><div class="h-8 w-1 bg-black"></div><div class="h-8 w-[1px] bg-black"></div><div class="h-8 w-3 bg-black"></div><div class="h-8 w-1 bg-black"></div><div class="h-8 w-1 bg-black"></div>
                </div>
            </div>
            <p class="text-[9px] text-gray-500 tracking-[0.3em]">BOOKKARU.COM</p>
        </div>
    </div>

</body>
</html>
